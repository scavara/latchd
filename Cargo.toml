[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/runner",
    "crates/launcher",
    "latchd",
]
exclude = ["dashboard"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
